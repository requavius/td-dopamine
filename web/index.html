<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mental Arithmetic Sets</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #2f5d8a; --accent-ink: #ffffff; --good: #2e7d4f; --bad: #b23a3a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9b9a93; --line: #33332f;
      --accent: #7fa8d6; --accent-ink: #10202f; --good: #6cc592; --bad: #e77b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1120px;
          margin: 0 auto; padding: 24px 16px; }

  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          text-align: center; padding: 48px 20px; min-height: 420px; }
  .header { color: var(--muted); font-size: 14px; letter-spacing: .02em; min-height: 1.4em;
            white-space: pre; }
  .problem { font-size: clamp(36px, 8vw, 56px); font-weight: 600; margin: 28px 0 24px;
             font-variant-numeric: tabular-nums; }
  .prompt { font-size: clamp(26px, 5vw, 36px); font-weight: 600; margin: 0 0 32px; }
  .flash { font-size: clamp(36px, 8vw, 52px); font-weight: 600; }
  .flash.correct { color: var(--good); } .flash.wrong { color: var(--bad); }
  input.answer { font: inherit; font-size: 32px; width: 200px; max-width: 100%; text-align: center;
                 padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                 background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
  input.answer:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 14px; margin: 14px 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; border-radius: 10px; padding: 12px 20px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; cursor: default; }
  kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 5px; margin-right: 6px; opacity: .8; }
  .note { color: var(--muted); max-width: 32em; }

  .status { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            color: var(--muted); font-size: 14px; }
  .status .unsaved { color: var(--bad); }

  /* The start screen: what this is, consent, and guest or email. */
  .start { text-align: left; max-width: 44em; width: 100%; }
  .start h1 { font-size: 26px; margin: 0 0 8px; }
  .start h2 { font-size: 17px; margin: 0 0 8px; }
  .consent { border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px; margin-top: 16px;
             max-height: 280px; overflow-y: auto; background: var(--bg); font-size: 15px; }
  .consent h3 { font-size: 15px; margin: 14px 0 4px; }
  .consent p { margin: 4px 0 10px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
             gap: 16px; margin-top: 20px; }
  .choice { border: 1px solid var(--line); border-radius: 12px; padding: 16px;
            display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .choice p { margin: 0; color: var(--muted); font-size: 14px; }
  .choice input[type=email] { font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px;
                              border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .choice label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .error { color: var(--bad); font-size: 14px; min-height: 1.2em; margin: 0; }

  /* Dev stuff: closed by default, so a player sees only the task. */
  .panel { border: 1px solid var(--line); border-radius: 14px; font-size: 14px; }
  .panel > summary { cursor: pointer; padding: 12px 18px; color: var(--muted); user-select: none; }
  .panel[open] { background: var(--card); }
  .panel[open] > summary { border-bottom: 1px solid var(--line); }
  .panel .sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                     gap: 24px; padding: 18px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .panel label { display: block; margin: 8px 0 2px; }
  .panel label.check { display: flex; gap: 8px; align-items: center; margin: 5px 0; }
  .panel input[type=range] { width: 100%; accent-color: var(--accent); }
  .panel input[type=number] { font: inherit; width: 70px; padding: 4px 6px; background: var(--bg);
                              color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  .panel .val { float: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel pre { font-family: var(--mono); font-size: 12px; margin: 0; white-space: pre-wrap; }
  .panel p { margin: 6px 0; color: var(--muted); }
  .panel button { padding: 7px 12px; font-size: 14px; margin: 8px 8px 0 0; }
  .panel a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="status" id="status" hidden><span id="who"></span><span id="saving"></span></div>
  <main class="task" id="task" aria-live="polite"><p class="note">loading…</p></main>
  <details class="panel" id="panel" hidden>
    <summary>dev stuff</summary>
    <div class="sections">
    <section>
      <h2>Settings (live)</h2>
      <label>target chance of getting it right <span class="val" data-val="target"></span></label>
      <input type="range" data-set="target" min="0.3" max="0.95" step="0.01">
      <label>stages per set</label>
      <input type="number" data-set="stages" min="2" max="8" step="1">
      <label>cold-start cost <span class="val" data-val="cold"></span></label>
      <input type="range" data-set="cold" min="0.05" max="1.5" step="0.01">
      <label>review rate (owed questions return) <span class="val" data-val="review"></span></label>
      <input type="range" data-set="review" min="0" max="1" step="0.01">
      <label class="check"><input type="checkbox" data-set="return_skipped"> skipped questions come back too</label>
      <label class="check"><input type="checkbox" data-set="controller"> controller sets target, review, feedback, skipped</label>
      <label class="check"><input type="checkbox" data-set="show_count"> show stage count</label>
      <label class="check"><input type="checkbox" data-set="show_score"> show score so far</label>
      <label class="check"><input type="checkbox" data-set="feedback"> feedback (from next set)</label>
      <label class="check"><input type="checkbox" data-set="show_choice"> offer repeat-or-continue</label>
      <label>when not offered, it:</label>
      <label class="check"><input type="radio" name="forced" data-set="forced" value="continue"> continues</label>
      <label class="check"><input type="radio" name="forced" data-set="forced" value="repeat"> repeats</label>
    </section>
    <section>
      <h2>Behind the scenes</h2>
      <pre id="stats"></pre>
      <p id="now"></p>
      <p id="controller"></p>
    </section>
    <section>
      <pre id="fit"></pre>
      <button id="fit-button">fit my parameters</button>
      <a id="export" href="#">export all decisions to csv</a>
    </section>
    </div>
  </details>
</div>

<!-- DRAFT consent text. Replace it with the wording your SRC/IRB approves, then bump
     CONSENT_VERSION in web.py so the record shows which version each person agreed to. -->
<template id="consent-text">
  <h3>What this is</h3>
  <p>This task is part of a student science research project on motivation: what makes
  people start, keep going on, and stop a task. It is draft wording and has not been
  approved yet.</p>
  <h3>What you will do</h3>
  <p>Answer short mental arithmetic questions in sets of a few questions. After a wrong
  answer you choose whether to try it again, and after each set whether to start another.
  You can stop whenever you like, and play again on other days.</p>
  <h3>What is recorded</h3>
  <p>Your email address; each question, your answer and whether it was right; how long
  you took to answer or to choose; when you skipped, stopped or left the page; and the
  task settings at the time. Nothing else about you or your device is collected.</p>
  <h3>How it is kept</h3>
  <p>Records are stored on the project's server under your email address and used only
  for this project. Your email is used only to link your sessions together and to
  contact you if you ask for your data to be deleted. It will not appear in any results.</p>
</template>

<script>
"use strict";
const FLASH_MS = 600; // as long as the desktop app shows "correct" / "wrong"
const task = document.getElementById("task");
const panel = document.getElementById("panel");
const statusBar = document.getElementById("status");

let config = { collect: false, consent_version: 0 };
let token = null;     // this page's session; a new one each time a session starts
let seq = null;       // the screen the server is showing
let screen = null;
let shownAt = 0;      // when the current screen was painted, for reaction times
let busy = false;
let keyHandler = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
};
const secs = () => (performance.now() - shownAt) / 1000;

async function call(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.ok) return res.json();
  let detail = `${res.status}`;
  try { detail = (await res.json()).detail || detail; } catch (e) {}
  const err = new Error(detail);
  err.status = res.status;
  throw err;
}

// Wait until the screen is actually on the display before starting its clock.
function painted(fn) { requestAnimationFrame(() => requestAnimationFrame(() => { shownAt = performance.now(); fn && fn(); })); }

function setScreen(...nodes) {
  if (keyHandler) document.removeEventListener("keydown", keyHandler);
  keyHandler = null;
  task.replaceChildren(...nodes);
}

// ---------------------------------------------------------------- start

function drawStart() {
  token = null; seq = null; screen = "start";
  statusBar.hidden = true;
  panel.hidden = true;

  const consent = el("div", { class: "consent" });
  consent.append(document.getElementById("consent-text").content.cloneNode(true));

  const guestError = el("p", { class: "error" });
  const guest = el("div", { class: "choice" },
    el("h2", {}, "Play as a guest"),
    el("p", {}, "No email. Nothing you do is saved, and it is gone when you leave the page."),
    el("button", { class: config.collect ? "" : "primary",
                   onclick: () => begin(null, false, guestError) }, "play as a guest"),
    guestError);

  const email = el("input", { type: "email", placeholder: "you@example.com", autocomplete: "email",
                              "aria-label": "email address" });
  email.value = store.get("temporal-email") || "";
  const agree = el("input", { type: "checkbox" });
  const agreed = () => store.get("temporal-consent") === `${config.consent_version}:${email.value.trim().toLowerCase()}`;
  agree.checked = agreed();
  email.addEventListener("input", () => { agree.checked = agreed(); });
  const emailError = el("p", { class: "error" });
  const go = () => {
    if (!email.value.trim()) { emailError.textContent = "Please enter your email address."; return; }
    begin(email.value, agree.checked, emailError);
  };
  email.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  const person = el("div", { class: "choice" },
    el("h2", {}, "Take part with your email"),
    el("p", {}, config.collect
      ? "Your sessions are saved under your email, so you can come back and carry on."
      : "Not open yet: Use guest"),
    email,
    el("label", {}, agree, el("span", {}, "I have read the information above and agree to take part.")),
    el("button", { class: config.collect ? "primary" : "", onclick: go }, "start"),
    emailError);

  setScreen(el("div", { class: "start" },
    el("h1", {}, "Mental arithmetic sets"),
    consent,
    el("div", { class: "choices" }, person, guest)));
}

async function begin(email, consent, errorLine) {
  if (busy) return;
  busy = true;
  errorLine.textContent = "";
  try {
    const data = await call("/api/open", { email, consent });
    token = data.token;
    if (email !== null) {
      store.set("temporal-email", data.email);
      if (consent) store.set("temporal-consent", `${config.consent_version}:${data.email}`);
    }
    document.getElementById("who").textContent = data.email ? `signed in as ${data.email}` : "guest";
    const saving = document.getElementById("saving");
    saving.textContent = data.saved ? "your answers are being saved" : "nothing is being saved";
    saving.className = data.saved ? "" : "unsaved";
    statusBar.hidden = false;
    busy = false;
    await apply(data);
  } catch (e) {
    errorLine.textContent = e.message;
  } finally { busy = false; }
}

// ---------------------------------------------------------------- the task

async function apply(data) {
  if (!data) return;
  updatePanel(data);
  const view = data.view;
  if (view.seq === seq && !data.flashes.length) return; // same screen: keep its clock
  seq = view.seq;
  screen = null; // nothing to answer while a flash is up
  for (const text of data.flashes) {
    setScreen(el("div", { class: "flash " + text }, text));
    await new Promise(r => setTimeout(r, FLASH_MS));
  }
  if (view.screen === "question") drawQuestion(view);
  else if (view.screen === "decision") drawDecision(view);
  else if (view.screen === "closed") ended(view.abandoned ? "This session was closed." : "Saved. See you next time.");
}

function drawQuestion(view) {
  const input = el("input", { class: "answer", inputmode: "numeric", autocomplete: "off",
                              "aria-label": "your answer" });
  const skipBtn = el("button", { onclick: skip }, el("kbd", {}, "esc"), "skip");
  setScreen(
    el("div", { class: "header" }, view.header || ""),
    el("div", { class: "problem" }, view.text),
    input,
    el("p", { class: "hint" }, "type the answer and press enter — or give up on it"),
    skipBtn,
  );
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); answer(input.value); }
    else if (e.key === "Escape") { e.preventDefault(); skip(); }
  });
  input.focus();
  painted(() => { screen = "question"; });
}

function drawDecision(view) {
  const yes = el("button", { class: "primary", onclick: () => decide(1) }, el("kbd", {}, "1"), view.yes);
  const no = el("button", { onclick: () => decide(0) }, el("kbd", {}, "2"), view.no);
  setScreen(el("div", { class: "prompt" }, view.prompt), el("div", { class: "row" }, yes, no));
  keyHandler = e => {
    if (e.key === "1") decide(1);
    else if (e.key === "2") decide(0);
  };
  document.addEventListener("keydown", keyHandler);
  painted(() => { screen = "decision"; });
}

function ended(message) {
  screen = "closed";
  token = null;
  if (message === "Saved. See you next time." && document.getElementById("saving").className === "unsaved") {
    message = "Thanks for playing. Nothing was saved.";
  }
  setScreen(el("p", { class: "note" }, message),
            el("button", { class: "primary", onclick: drawStart }, "back to the start"));
}

async function send(path, extra) {
  if (busy || !token) return;
  busy = true;
  const rt = secs();
  screen = null;
  try { await apply(await call(path, { token, seq, rt, ...extra })); }
  catch (e) {
    ended(e.status === 409 ? "This session has moved on. It may be open in another tab."
                           : "Something went wrong: " + e.message);
  }
  finally { busy = false; }
}
function answer(raw) { if (screen === "question") send("/api/answer", { raw }); }
function skip() { if (screen === "question") send("/api/skip"); }
function decide(go) { if (screen === "decision") send("/api/decide", { go }); }

// Leaving the page is closing the window: logged with what was on screen and for how long.
window.addEventListener("pagehide", () => {
  if (!token || seq === null || screen === "closed") return;
  const body = JSON.stringify({ token, seq, rt: secs() });
  navigator.sendBeacon("/api/close", new Blob([body], { type: "application/json" }));
  screen = "closed";
});
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

// ---------------------------------------------------------------- dev stuff

function updatePanel(data) {
  panel.hidden = !data.panel;
  if (!data.panel) return;
  for (const input of panel.querySelectorAll("[data-set]")) {
    if (input === document.activeElement) continue; // don't pull a control out from under a drag
    const v = data.settings[input.dataset.set];
    if (input.type === "checkbox") input.checked = v;
    else if (input.type === "radio") input.checked = input.value === v;
    else input.value = v;
  }
  for (const span of panel.querySelectorAll("[data-val]")) {
    span.textContent = Number(data.settings[span.dataset.val]).toFixed(2);
  }
  document.getElementById("stats").textContent = data.stats;
  document.getElementById("now").textContent = data.now;
  document.getElementById("controller").textContent = "controller: " + data.controller;
  document.getElementById("fit").textContent = data.fit;
  document.getElementById("fit-button").disabled = data.fitting;
}

for (const input of panel.querySelectorAll("[data-set]")) {
  input.addEventListener("change", async () => {
    const name = input.dataset.set;
    const value = input.type === "checkbox" ? input.checked
                : input.type === "radio" || name === "forced" ? input.value : Number(input.value);
    input.blur();
    try { updatePanel(await call("/api/settings", { token, settings: { [name]: value } })); } catch (e) {}
  });
}
document.getElementById("fit-button").onclick = async () => {
  try { updatePanel(await call("/api/fit", { token })); } catch (e) {}
};
// Fetched rather than navigated to, so the page never looks like it is being left.
document.getElementById("export").onclick = async e => {
  e.preventDefault();
  if (!token) return;
  const res = await fetch("/api/export?token=" + encodeURIComponent(token));
  if (!res.ok) return;
  const url = URL.createObjectURL(await res.blob());
  el("a", { href: url, download: "decisions.csv" }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// Remember whether this browser left dev stuff open.
panel.open = store.get("temporal-dev-open") === "1";
panel.addEventListener("toggle", () => store.set("temporal-dev-open", panel.open ? "1" : "0"));

// Fits and controller plans finish in the background; pick up their results.
setInterval(async () => {
  if (panel.hidden || !panel.open || !token || document.hidden) return;
  try { updatePanel(await call("/api/state?token=" + encodeURIComponent(token))); } catch (e) {}
}, 3000);

(async () => {
  try { config = await call("/api/config"); } catch (e) {}
  drawStart();
})();
</script>
</body>
</html>
