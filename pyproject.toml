[project]
name = "temporal"
version = "0.1.0"
description = "Measuring reward sensitivity and effort aversion from how people start work"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pydantic>=2.13.5",
    "pyddm==0.9.0",
    "scipy==1.17.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
